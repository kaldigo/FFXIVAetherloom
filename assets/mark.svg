<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Aetherloom woven threads</title>
  <defs>
    <linearGradient id="silk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#00efbb"/>
      <stop offset=".28" stop-color="#00e5d8"/>
      <stop offset=".5" stop-color="#8887ff"/>
      <stop offset=".73" stop-color="#d533ff"/>
      <stop offset="1" stop-color="#f000ef"/>
    </linearGradient>
    <mask id="weave">
      <g transform="rotate(-45 256 256)">
